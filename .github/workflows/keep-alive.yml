name: Keep Render service awake

# چرا این فایل هست:
# پلن رایگان Render بعد از ۱۵ دقیقه بدون درخواست، سرویس را می‌خواباند و درخواست بعدی
# باید منتظر بیدار شدن بماند. این workflow هر ۱۰ دقیقه یک درخواست ساده به health-check
# endpoint خود سرویس (مسیر "/") می‌زند تا هیچ‌وقت idle حساب نشود.
# این endpoint هیچ داده‌ای تغییر نمی‌دهد و نیازی به secret ندارد — همان GET ساده‌ای
# که در server.py برای بررسی سلامت سرویس تعریف شده.
#
# نکته‌ی مهم (که اولین نسخه‌ی این فایل نداشت): خود بیدار شدن از حالت sleep می‌تواند
# به‌خاطر وزن استارتاپ این سرویس (اتصال به Supabase + initialize اپلیکیشن تلگرام)
# بیشتر از عدد معمول Render طول بکشد. مهلت ۶۰ ثانیه‌ی نسخه‌ی قبلی گاهی همین وسط کار
# قطع می‌شد و خودش باعث یک ایمیل «fail» می‌شد، نه اینکه سرویس واقعاً مشکلی داشته باشد.

on:
  schedule:
    # هر ۱۰ دقیقه (کران‌های گیت‌هاب تضمین‌شده نیستند و ممکن است چند دقیقه تاخیر بیفتد؛
    # ۱۰ دقیقه، با فاصله‌ی ۵ دقیقه‌ای نسبت به سقف ۱۵ دقیقه‌ی Render، جای کافی برای
    # همین تاخیرهای معمول می‌گذارد)
    - cron: "*/10 * * * *"
  # اجازه‌ی اجرای دستی از تب Actions گیت‌هاب، برای تست فوری بدون صبر کردن تا نوبت بعدی
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health-check endpoint
        run: |
          set -e
          url="${{ secrets.RENDER_SERVICE_URL }}"
          if [ -z "$url" ]; then
            echo "::error::سکرت RENDER_SERVICE_URL در تنظیمات ریپازیتوری تعریف نشده است."
            exit 1
          fi

          # -f یعنی اگر پاسخ ۴xx/۵xx بود، exit code ناموفق برگردد؛ درخواست خودش،
          # صرف‌نظر از پاسخ، برای بیدار نگه‌داشتن Render کافی است.
          # --max-time 170: مهلت کافی برای کامل شدن یک cold start واقعی (نه فقط
          # رسیدن TCP)، تا خود این ping به‌خاطر کندی بیدار شدن fail نشود.
          # دو تلاش با یک وقفه‌ی کوتاه: اگر با همه‌ی این مهلت هم جواب نیامد
          # (یعنی احتمالاً یک مشکل واقعی‌تر از صرف cold start در کار است)،
          # یک بار دیگر امتحان می‌کنیم قبل از اینکه واقعاً fail اعلام شود.
          attempt=1
          max_attempts=2
          until curl --fail --silent --show-error --max-time 170 "$url"; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::بعد از $max_attempts تلاش، سرویس جواب نداد."
              exit 1
            fi
            echo "تلاش $attempt ناموفق بود؛ ۱۰ ثانیه صبر و تلاش دوباره..."
            attempt=$((attempt + 1))
            sleep 10
          done
